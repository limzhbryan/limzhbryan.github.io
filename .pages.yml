# Settings for the visual editor at https://app.pagescms.org
# Writing types: Opinion, Analysis, Research
# Each entry below becomes a section in the editor's left menu, in the same order as the site's menu.
media:
  input: files
  output: /files

content:
  - name: home
    label: Home
    type: file
    path: content/home.json
    format: json
    fields:
      - { name: headline, label: Big headline, type: string }
      - { name: intro, label: Intro paragraph, type: text }
      - { name: intro_more, label: Second line, type: text }
      - { name: themes_title, label: Themes heading, type: string }
      - name: themes
        label: Themes
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Description, type: text }
          - name: link
            label: Links to
            type: select
            description: "Page opened when someone clicks this box. Leave empty to guess from the title."
            options: { values: [Opinion, Analysis, Research, All writing, Markets, About, Resume, Contact, No link] }

  - name: articles
    label: Writing
    type: file
    path: content/articles.json
    format: json
    fields:
      - { name: intro, label: Writing page intro, type: text }
      - name: articles
        label: Posts (newest appear first automatically)
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: date, label: Date, type: date, options: { format: yyyy-MM-dd } }
          - name: type
            label: Type
            type: select
            options: { values: [Opinion, Analysis, Research] }
          - { name: venue, label: Journal or outlet (optional), type: string, description: "For research or pieces published elsewhere, e.g. Journal of International Economics." }
          - { name: summary, label: One-line summary, type: text, description: "Shown under the title in lists and at the top of the article." }
          - { name: why_it_matters, label: Why it matters (optional), type: text, description: "One or two plain-English sentences for non-academic readers. Best for research." }
          - { name: featured, label: Feature on the homepage, type: boolean, description: "Tick one article. If none is ticked, the newest one is featured." }
          - { name: image, label: Homepage image (optional), type: image, description: "A chart or picture shown next to the featured article." }
          - { name: image_caption, label: Image caption, type: string }
          - { name: read_time, label: Reading time, type: string, description: "For example: 6 min read" }
          - { name: external_url, label: Link to another site (optional), type: string, description: "For research papers or pieces published elsewhere (journal page, PDF or SSRN link). If filled in, the title links there." }
          - { name: body, label: Article text, type: rich-text, description: "Leave empty for a piece that only links elsewhere." }

  - name: markets
    label: Markets
    type: file
    path: content/markets-page.json
    format: json
    fields:
      - { name: intro, label: Intro at the top, type: text }
      - { name: note, label: Data note at the bottom, type: text }

  - name: commentary
    label: Markets daily commentary
    type: file
    path: data/commentary.json
    format: json
    fields:
      - { name: date, label: Market date, type: date, options: { format: yyyy-MM-dd } }
      - { name: headline, label: Headline, type: string }
      - { name: paragraphs, label: Paragraphs, type: text, list: true }
      - name: sources
        label: Sources
        type: object
        list: true
        fields:
          - { name: title, label: Source name, type: string }
          - { name: url, label: Link, type: string }

  - name: about
    label: About
    type: file
    path: content/about.json
    format: json
    fields:
      - { name: photo, label: Your photo, type: image, description: "Portrait, ideally 4:5" }
      - { name: about, label: About text, type: rich-text }

  - name: resume
    label: Resume
    type: file
    path: content/resume.json
    format: json
    fields:
      - { name: pdf, label: Resume PDF, type: file, description: "Upload a new PDF to replace the download link." }
      - name: experience
        label: Experience
        type: object
        list: true
        fields:
          - { name: organisation, label: Company, type: string }
          - { name: role, label: Role, type: string }
          - { name: dates, label: Dates, type: string }
      - name: education
        label: Education
        type: object
        list: true
        fields:
          - { name: qualification, label: Qualification, type: string }
          - { name: school, label: School, type: string }
          - { name: dates, label: Dates, type: string }
      - name: teaching
        label: Teaching
        type: object
        list: true
        fields:
          - { name: organisation, label: Where, type: string }
          - { name: role, label: What you taught, type: string }
          - { name: dates, label: Dates, type: string }
      - name: leadership
        label: Leadership
        type: object
        list: true
        fields:
          - { name: organisation, label: Organisation, type: string }
          - { name: role, label: Role, type: string }
          - { name: dates, label: Dates, type: string }
      - { name: skills, label: Skills, type: text }

  - name: contact
    label: Contact
    type: file
    path: content/contact.json
    format: json
    fields:
      - { name: intro, label: Intro, type: text }
      - { name: email, label: Email, type: string }
      - { name: linkedin, label: LinkedIn URL, type: string }
      - { name: location, label: Location, type: string }
      - { name: footer_note, label: Footer note (bottom of every page), type: string }
