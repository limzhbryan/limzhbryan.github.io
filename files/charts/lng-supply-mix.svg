<text x="20" y="58" fill="#646B74">Singapore gas supply by source, billion British thermal units per day (BBTUD)</text>
<rect x="20" y="74" width="12" height="12" fill="#9AA1AA"/><text x="38" y="84" fill="#646B74">Pipeline: Indonesia</text>
