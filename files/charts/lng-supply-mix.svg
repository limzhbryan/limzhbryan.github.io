<text x="357.2" y="132.0" text-anchor="middle" fill="#18202B">158</text>
<rect x="382.6" y="110" width="242.0" height="34" fill="#1E3D63"/>
<text x="503.6" y="132.0" text-anchor="middle" fill="#FFFFFF">753</text>
<text x="632.6" y="132.0" fill="#18202B" font-weight="600">LNG 57%</text>
<text x="188" y="194.0" text-anchor="end" fill="#18202B">2029, if Indonesia stops</text>
<rect x="200.0" y="172" width="50.8" height="34" fill="#C9CDD2"/>
<text x="225.4" y="194.0" text-anchor="middle" fill="#18202B">158</text>
<rect x="250.8" y="172" width="380.9" height="34" fill="#1E3D63"/>
<text x="441.2" y="194.0" text-anchor="middle" fill="#FFFFFF">1,185</text>
