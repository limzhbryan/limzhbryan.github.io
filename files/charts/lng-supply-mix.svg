<rect x="360" y="74" width="12" height="12" fill="#1E3D63"/><text x="378" y="84" fill="#646B74">LNG</text>
<text x="188" y="132.0" text-anchor="end" fill="#18202B">2025, today</text>
<rect x="200.0" y="110" width="131.8" height="34" fill="#9AA1AA"/>
<text x="265.9" y="132.0" text-anchor="middle" fill="#FFFFFF">410</text>
