<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 210" role="img" aria-label="Illustrative chart: delivered price rises after a freight shock while producer netback falls">
  <g font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#7A828C">
    <line x1="34" y1="30" x2="410" y2="30" stroke="#C9CDD2" stroke-opacity=".6"/>
    <line x1="34" y1="90" x2="410" y2="90" stroke="#C9CDD2" stroke-opacity=".6"/>
    <line x1="34" y1="150" x2="410" y2="150" stroke="#C9CDD2" stroke-opacity=".6"/>
    <text x="28" y="34" text-anchor="end">110</text>
    <text x="28" y="94" text-anchor="end">100</text>
    <text x="28" y="154" text-anchor="end">90</text>
    <line x1="222" y1="20" x2="222" y2="178" stroke="#7A828C" stroke-dasharray="3 4"/>
    <text x="222" y="196" text-anchor="middle">Freight shock</text>
    <text x="34" y="196">Week −8</text>
    <text x="410" y="196" text-anchor="end">Week +8</text>
  </g>
  <polyline fill="none" stroke="#7A828C" stroke-width="2" stroke-linejoin="round" points="34,92 57,89 81,93 104,90 128,88 151,92 175,89 198,91 222,90 245,97 269,103 292,107 316,109 339,110 363,111 386,112 410,112"/>
  <polyline fill="none" stroke="#C2553A" stroke-width="2.6" stroke-linejoin="round" points="34,89 57,91 81,88 104,90 128,87 151,91 175,89 198,88 222,90 245,72 269,58 292,50 316,46 339,43 363,41 386,40 410,39"/>
  <circle cx="410" cy="39" r="4" fill="#C2553A"/>
  <g font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">
    <text x="404" y="62" text-anchor="end" fill="#C2553A">Delivered price +9%</text>
    <text x="404" y="132" text-anchor="end" fill="#7A828C">Producer netback −4%</text>
  </g>
</svg>
