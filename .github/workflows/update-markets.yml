name: Update market data

on:
  schedule:
    - cron: "30 22 * * *"   # 06:30 Singapore time, every day
  workflow_dispatch:
  push:
    branches: [market-insights]
    paths: [scripts/update_markets.py, .github/workflows/update-markets.yml]

permissions:
  contents: write

concurrency:
  group: update-markets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check data sources
        run: |
          for u in \
            "https://api.stlouisfed.org/fred/series/observations?series_id=DCOILBRENTEU" \
            "https://query1.finance.yahoo.com/v8/finance/chart/BZ=F?range=5d&interval=1d" \
            "https://stooq.com/q/d/l/?s=cb.f&i=d" \
            "https://data-api.ecb.europa.eu/service/data/EXR/D.SGD.EUR.SP00.A?lastNObservations=3&format=csvdata" \
            "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/2026/all?type=daily_treasury_yield_curve&field_tdr_date_value=2026" \
            "https://www.worldbank.org/en/research/commodity-markets" ; do
            curl -sS -m 30 -A "Mozilla/5.0" -o /tmp/p.out -w "%{http_code} %{time_total}s $u\n" "$u" || echo "FAIL $u"
            head -c 300 /tmp/p.out | tr '\n' ' '; echo; echo ---
          done
      - name: Fetch latest data
        timeout-minutes: 10
        continue-on-error: true
        run: python -u scripts/update_markets.py
      - name: Commit if changed
        run: |
          git config user.name "market-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/markets.json
          if git diff --cached --quiet; then
            echo "No change in data."
          else
            git commit -m "Update market data $(date -u +%Y-%m-%d)"
            git push
          fi
